                        { name: " synaptic", icon: "fa-puzzle-piece", color: "#D70A53" }
                    ],
                    windows: [
                        { 
                            title: " synaptic 包管理器", 
                            x: 150, 
                            y: 100, 
                            width: 600, 
                            height: 400,
                            content: "已安装 (1,234) | 可升级 (5) | 未安装 (45,678)"
                        }
                    ]
                }
            },
            {
                id: 8,
                type: "linux",
                name: "Fedora Workstation 39",
                version: "39",
                release: "2023年11月",
                vendor: "Fedora Project (Red Hat 赞助)",
                baseline: "基于 RHEL 上游开发分支",
                code: "Silverblue（变体）",
                description: "Fedora Workstation 39 是面向桌面用户的前沿 Linux 发行版，采用最新的 GNOME 桌面环境，优先集成开源社区的新功能，更新周期短（每 6 个月一次），适合开发者和技术爱好者体验最新 Linux 技术。",
                features: [
                    "- 前沿技术：率先支持最新内核、桌面环境和软件",
                    "- 预装开发工具（Git、GCC、Docker），开箱即用",
                    "- 支持原子化更新（Silverblue 变体），系统可回滚",
                    "- 内置 Flatpak 应用商店，轻松获取跨发行版软件"
                ],
                desktop: {
                    background: "linear-gradient(135deg, #294172 0%, #5072A7 100%)",
                    icons: [
                        { name: "主目录", icon: "fa-folder", color: "#3584E4" },
                        { name: "Firefox", icon: "fa-firefox", color: "#FF9500" },
                        { name: "终端", icon: "fa-terminal", color: "#555555" },
                        { name: "VS Code", icon: "fa-code", color: "#007ACC" },
                        { name: "软件", icon: "fa-th", color: "#3584E4" }
                    ],
                    windows: [
                        { 
                            title: "VS Code", 
                            x: 100, 
                            y: 80, 
                            width: 650, 
                            height: 400,
                            content: "main.js - Visual Studio Code",
                            rounded: true
                        }
                    ]
                }
            }
        ];

        // 2. DOM 元素获取
        const welcomeScreen = document.getElementById('welcome-screen');
        const detailScreen = document.getElementById('detail-screen');
        const flashScreen = document.getElementById('flash-screen');
        const userInput = document.getElementById('user-input');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');
        const backBtn = document.getElementById('back-btn');
        const flashRestart = document.getElementById('flash-restart');
        const flashExit = document.getElementById('flash-exit');

        // 3. 初始化：生成系统列表（包含桌面缩略图）
        function initSystemList() {
            const windowsList = document.getElementById('windows-list');
            const linuxList = document.getElementById('linux-list');
            
            // 分类渲染 Windows 和 Linux 卡片
            systemDatabase.forEach(sys => {
                // 生成卡片缩略图中的简化桌面
                const thumbnailDesktop = generateThumbnailDesktop(sys);
                
                const card = document.createElement('div');
                card.className = 'bg-white border rounded-lg overflow-hidden shadow-sm sys-card-hover';
                card.innerHTML = `
                    <div class="relative h-36 overflow-hidden">
                        <div class="w-full h-full">${thumbnailDesktop}</div>
                        <div class="absolute top-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded">
                            编号: ${sys.id}
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center mb-2">
                            <i class="fa fa-${sys.type} text-${sys.type} text-xl mr-2"></i>
                            <span class="font-bold text-gray-800">${sys.name}</span>
                        </div>
                        <p class="text-gray-600 text-sm mb-2">版本：${sys.version}</p>
                        <p class="text-gray-500 text-xs">
                            <i class="fa fa-code-fork mr-1"></i> ${sys.code}
                        </p>
                    </div>
                `;
                
                // 点击卡片直接进入详情
                card.addEventListener('click', () => {
                    showSystemDetail(sys.id);
                });
                
                // 按类型添加到对应列表
                if (sys.type === 'windows') {
                    windowsList.appendChild(card);
                } else {
                    linuxList.appendChild(card);
                }
            });
        }

        // 4. 生成缩略图中的简化桌面
        function generateThumbnailDesktop(sys) {
            const desktop = sys.desktop;
            let iconsHtml = '';
            
            // 只显示前3个图标
            const displayIcons = desktop.icons.slice(0, 3);
            displayIcons.forEach((icon, index) => {
                iconsHtml += `
                    <div class="absolute left-4 top-${8 + index * 10}" style="width: 40px; text-align: center;">
                        <div class="w-8 h-8 mx-auto rounded-full flex items-center justify-center" style="background-color: ${icon.color}20; color: ${icon.color}">
                            <i class="fa ${icon.icon}"></i>
                        </div>
                    </div>
                `;
            });
            
            // 简化的任务栏
            let taskbarHtml = '';
            if (sys.type === 'windows') {
                taskbarHtml = `
                    <div class="absolute bottom-0 left-0 right-0 h-8 bg-winTaskbar flex items-center px-2">
                        <div class="w-6 h-6 bg-winStart rounded flex items-center justify-center text-white">
                            <i class="fa fa-windows"></i>
                        </div>
                        <div class="ml-2 flex space-x-1">
                            <div class="w-6 h-6 rounded-sm bg-white/20 flex items-center justify-center text-white text-xs">
                                <i class="fa fa-search"></i>
                            </div>
                            <div class="w-20 h-6 rounded-sm bg-white/20 flex items-center px-1 text-white text-xs truncate">
                                文件资源管理器
                            </div>
                        </div>
                        <div class="ml-auto flex items-center">
                            <div class="w-8 h-6 flex items-center justify-center text-white">
                                <i class="fa fa-volume-up"></i>
                            </div>
                            <div class="w-16 h-6 flex items-center justify-center text-white text-xs">
                                14:30
                            </div>
                        </div>
                    </div>
                `;
            } else {
                taskbarHtml = `
                    <div class="absolute bottom-0 left-0 right-0 h-8 bg-gnomePanel flex items-center px-2">
                        <div class="w-6 h-6 flex items-center justify-center text-white">
                            <i class="fa fa-ubuntu"></i>
                        </div>
                        <div class="ml-2 flex space-x-1">
                            <div class="w-6 h-6 rounded-sm bg-white/20 flex items-center justify-center text-white text-xs">
                                <i class="fa fa-search"></i>
                            </div>
                            <div class="w-20 h-6 rounded-sm bg-white/20 flex items-center px-1 text-white text-xs truncate">
                                终端
                            </div>
                        </div>
                        <div class="ml-auto flex items-center">
                            <div class="w-8 h-6 flex items-center justify-center text-white">
                                <i class="fa fa-volume-up"></i>
                            </div>
                            <div class="w-16 h-6 flex items-center justify-center text-white text-xs">
                                14:30
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="w-full h-full relative" style="background: ${desktop.background}">
                    ${iconsHtml}
                    ${taskbarHtml}
                </div>
            `;
        }

        // 5. 生成完整的虚拟桌面
        function generateFullDesktop(sys) {
            const desktop = sys.desktop;
            let iconsHtml = '';
            let windowsHtml = '';
            
            // 生成桌面图标
            desktop.icons.forEach((icon, index) => {
                const row = Math.floor(index / 3);
                const col = index % 3;
                iconsHtml += `
                    <div class="desktop-icon absolute" style="left: ${20 + col * 80}px; top: ${20 + row * 90}px; width: 60px; text-align: center;">
                        <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center mb-1" style="background-color: ${icon.color}20; color: ${icon.color}">
                            <i class="fa ${icon.icon} text-lg"></i>
                        </div>
                        <div class="text-white text-xs shadow-md">${icon.name}</div>
                    </div>
                `;
            });
            
            // 生成窗口
            desktop.windows.forEach(window => {
                const windowClasses = window.rounded ? 'rounded-lg window-shadow' : 'window-shadow';
                windowsHtml += `
                    <div class="absolute ${windowClasses}" style="left: ${window.x}px; top: ${window.y}px; width: ${window.width}px; height: ${window.height}px; background-color: white;">
                        <div class="h-8 bg-gray-800 text-white px-3 flex items-center justify-between">
                            <div class="text-sm font-medium">${window.title}</div>
                            <div class="flex space-x-1">
                                <div class="w-5 h-5 flex items-center justify-center hover:bg-gray-700 rounded-sm">
                                    <i class="fa fa-window-minimize text-xs"></i>
                                </div>
                                <div class="w-5 h-5 flex items-center justify-center hover:bg-gray-700 rounded-sm">
                                    <i class="fa fa-window-maximize text-xs"></i>
                                </div>
                                <div class="w-5 h-5 flex items-center justify-center hover:bg-red-600 rounded-sm">
                                    <i class="fa fa-times text-xs"></i>
                                </div>
                            </div>
                        </div>
                        <div class="p-4 text-sm text-gray-700">
                            <p>${window.content}</p>
                            <div class="mt-2 h-1 bg-gray-200 rounded-full overflow-hidden">
                                <div class="h-full bg-gray-400" style="width: 60%"></div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            // 生成任务栏
            let taskbarHtml = '';
            if (sys.type === 'windows') {
                taskbarHtml = `
                    <div class="absolute bottom-0 left-0 right-0 h-10 bg-winTaskbar flex items-center px-4">
                        <div class="w-8 h-8 bg-winStart rounded flex items-center justify-center text-white">
                            <i class="fa fa-windows"></i>
                        </div>
                        <div class="ml-3 flex space-x-2">
                            <div class="h-8 px-3 bg-white/20 flex items-center text-white text-sm rounded-sm">
                                <i class="fa fa-search mr-1"></i> 搜索
                            </div>
                            <div class="h-8 px-3 bg-windows flex items-center text-white text-sm rounded-sm">
                                <i class="fa fa-folder mr-1"></i> ${desktop.windows[0].title}
                            </div>
                            <div class="h-8 w-8 bg-white/20 flex items-center justify-center text-white rounded-sm">
                                <i class="fa fa-edge"></i>
                            </div>
                        </div>
                        <div class="ml-auto flex items-center space-x-4">
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-volume-up"></i>
                            </div>
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-wifi"></i>
                            </div>
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-battery-full"></i>
                            </div>
                            <div class="text-white text-sm">
                                14:30
                            </div>
                            <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-white">
                                <i class="fa fa-user"></i>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                taskbarHtml = `
                    <div class="absolute bottom-0 left-0 right-0 h-10 bg-gnomePanel flex items-center px-4">
                        <div class="w-8 h-8 flex items-center justify-center text-white">
                            <i class="fa fa-ubuntu text-lg"></i>
                        </div>
                        <div class="ml-3 flex space-x-2">
                            <div class="h-8 px-3 bg-white/20 flex items-center text-white text-sm rounded-sm">
                                <i class="fa fa-search mr-1"></i> 活动
                            </div>
                            <div class="h-8 px-3 bg-linux flex items-center text-gray-800 text-sm rounded-sm">
                                <i class="fa fa-terminal mr-1"></i> ${desktop.windows[0].title}
                            </div>
                            <div class="h-8 w-8 bg-white/20 flex items-center justify-center text-white rounded-sm">
                                <i class="fa fa-firefox"></i>
                            </div>
                        </div>
                        <div class="ml-auto flex items-center space-x-4">
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-volume-up"></i>
                            </div>
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-wifi"></i>
                            </div>
                            <div class="h-8 w-8 flex items-center justify-center text-white">
                                <i class="fa fa-battery-full"></i>
                            </div>
                            <div class="text-white text-sm">
                                14:30
                            </div>
                            <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-white">
                                <i class="fa fa-user"></i>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="w-full h-full relative" style="background: ${desktop.background}">
                    ${iconsHtml}
                    ${windowsHtml}
                    ${taskbarHtml}
                </div>
            `;
        }

        // 6. 预览功能：显示系统详情（包含完整虚拟桌面）
        function showSystemDetail(sysId) {
            const system = systemDatabase.find(sys => sys.id === parseInt(sysId));
            if (!system) return false;
            
            // 填充详情数据
            document.getElementById('detail-name').textContent = system.name;
            document.getElementById('detail-baseline').textContent = system.baseline;
            document.getElementById('detail-version').textContent = system.version;
            document.getElementById('detail-release').textContent = system.release;
            document.getElementById('detail-vendor').textContent = system.vendor;
            document.getElementById('detail-type').textContent = system.type === 'windows' ? '闭源商业操作系统' : '开源 Linux 发行版';
            document.getElementById('detail-code').textContent = `开发代号：${system.code}`;
            document.getElementById('detail-description').textContent = system.description;
            
            // 生成并设置虚拟桌面
            const desktopElement = document.getElementById('detail-desktop');
            desktopElement.innerHTML = generateFullDesktop(system);
            
            // 渲染特性列表
            const featuresList = document.getElementById('detail-features');
            featuresList.innerHTML = '';
            system.features.forEach(feature => {
                const li = document.createElement('li');
                li.innerHTML = feature;
                featuresList.appendChild(li);
            });
            
            // 设置系统图标
            const iconElement = document.getElementById('detail-icon');
            iconElement.className = `fa fa-${system.type} text-${system.type} text-6xl mb-4`;
            
            // 切换界面
            welcomeScreen.classList.add('hidden');
            detailScreen.classList.remove('hidden');
            return true;
        }

        // 7. 安装功能
        function executeInstallation(sysId) {
            const system = systemDatabase.find(sys => sys.id === parseInt(sysId));
            if (!system) return false;
            
            // 切换到安装界面
            welcomeScreen.classList.add('hidden');
            detailScreen.classList.add('hidden');
            flashScreen.classList.remove('hidden');
            
            // 设置安装系统名称
            document.getElementById('flash-system-name').textContent = `正在安装 ${system.name} (${system.version})`;
            
            // 安装步骤与进度
            const progressBar = document.getElementById('flash-progress');
            const logsContainer = document.getElementById('flash-logs');
            const steps = [
                { text: '正在检查硬件兼容性...', progress: 15, delay: 1500 },
                { text: '正在格式化目标分区...', progress: 30, delay: 1200 },
                { text: '正在复制系统文件...', progress: 60, delay: 2000 },
                { text: '正在配置系统参数...', progress: 80, delay: 1500 },
                { text: '正在安装驱动程序...', progress: 90, delay: 1200 },
                { text: '安装完成，正在准备重启...', progress: 100, delay: 1800 }
            ];
            
            // 执行安装步骤
            let stepIndex = 0;
            function executeStep() {
                if (stepIndex < steps.length) {
                    const step = steps[stepIndex];
                    // 更新日志
                    const logItem = document.createElement('p');
                    logItem.innerHTML = `<i class="fa fa-check-circle text-green-500 mr-2"></i>${step.text}`;
                    logsContainer.appendChild(logItem);
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                    
                    // 更新进度
                    progressBar.style.width = `${step.progress}%`;
                    
                    // 执行下一步
                    stepIndex++;
                    setTimeout(executeStep, step.delay);
                } else {
                    // 安装完成，显示操作按钮
                    const successLog = document.createElement('p');
                    successLog.innerHTML = `<i class="fa fa-flag-checkered text-green-600 mr-2"></i>恭喜！${system.name} 已成功安装并启动`;
                    logsContainer.appendChild(successLog);
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                    document.getElementById('flash-buttons').classList.remove('hidden');
                }
            }
            
            // 启动安装流程
            setTimeout(executeStep, 1000);
            return true;
        }

        // 8. 事件监听：提交按钮
        submitBtn.addEventListener('click', handleSubmit);
        userInput.addEventListener('keydown', (e) => e.key === 'Enter' && handleSubmit());
        
        function handleSubmit() {
            const inputValue = userInput.value.trim().toLowerCase();
            errorMessage.classList.add('hidden');
            userInput.value = '';
            
            // 情况1：输入 flash 进入安装选择
            if (inputValue === 'flash') {
                const targetId = prompt('请输入要安装的系统编号（1-8）：');
                if (!targetId) return;
                const isSuccess = executeInstallation(targetId);
                if (!isSuccess) {
                    errorMessage.classList.remove('hidden');
                    // 回到欢迎界面
                    flashScreen.classList.add('hidden');
                    welcomeScreen.classList.remove('hidden');
                }
            } 
            // 情况2：输入编号查看详情
            else if (/^\d+$/.test(inputValue)) {
                const isSuccess = showSystemDetail(inputValue);
                if (!isSuccess) {
                    errorMessage.classList.remove('hidden');
                }
            } 
            // 情况3：无效输入
            else {
                errorMessage.classList.remove('hidden');
            }
        }

        // 9. 事件监听：返回按钮（从预览回到列表）
        backBtn.addEventListener('click', () => {
            detailScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
        });

        // 10. 事件监听：安装完成后操作
        flashRestart.addEventListener('click', () => {
            // 重置安装界面
            document.getElementById('flash-progress').style.width = '0%';
            document.getElementById('flash-logs').innerHTML = '<p><i class="fa fa-spinner fa-spin mr-2"></i> 初始化安装环境...</p>';
            document.getElementById('flash-buttons').classList.add('hidden');
            
            // 回到欢迎界面
            flashScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
        });
        
        flashExit.addEventListener('click', () => {
            alert('感谢使用系统安装程序！');
            window.close(); // 仅在弹出窗口中有效，浏览器标签页需手动关闭
        });

        // 11. 初始化页面
        window.onload = initSystemList;
    </script>
</body>
</html>
