<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 资源下载站</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e7eaf6;
    background:
      radial-gradient(1100px 520px at 50% -12%, #24326b 0%, transparent 70%),
      #0b0e18;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 34px; }

  header h1 {
    font-size: clamp(24px, 4vw, 34px);
    margin: 0 0 10px;
    letter-spacing: .5px;
    background: linear-gradient(90deg, #7cc4ff, #a78bfa 60%, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p { margin: 0; color: #8a93b5; font-size: 14px; }

  .search-box { position: relative; margin-bottom: 24px; }

  #search {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 15px;
    color: #e7eaf6;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 12px;
    outline: none;
    transition: .2s;
  }

  #search:focus {
    border-color: #5b8cff;
    background: rgba(91, 140, 255, .08);
    box-shadow: 0 0 0 4px rgba(91, 140, 255, .12);
  }

  #search::placeholder { color: #6b7391; }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    opacity: .7;
    pointer-events: none;
  }

  .file-card {
    display: flex;
    gap: 16px;
    padding: 20px;
    margin-bottom: 14px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    border: 1px solid rgba(255, 255, 255, .09);
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }

  .file-card:hover {
    transform: translateY(-2px);
    border-color: rgba(124, 196, 255, .35);
    box-shadow: 0 12px 30px -14px rgba(80, 130, 255, .6);
  }

  .card-icon {
    flex: 0 0 52px;
    height: 52px;
    display: grid;
    place-items: center;
    font-size: 24px;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(124,196,255,.2), rgba(167,139,250,.18));
    border: 1px solid rgba(255,255,255,.1);
  }

  .card-body { flex: 1; min-width: 0; }

  .card-body h3 {
    margin: 2px 0 6px;
    font-size: 17px;
    font-weight: 600;
  }

  .desc {
    margin: 0 0 12px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #99a1c2;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    color: #7f88a8;
    margin-bottom: 14px;
  }

  .meta span {
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.07);
  }

  .meta .tag { color: #8ec5ff; border-color: rgba(124,196,255,.3); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: .18s;
    white-space: nowrap;
  }

  .btn.primary {
    color: #06122b;
    background: linear-gradient(135deg, #7cc4ff, #a78bfa);
    box-shadow: 0 8px 20px -10px rgba(124,196,255,.9);
  }

  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }

  .btn.ghost {
    color: #b9c1de;
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.12);
  }

  .btn.ghost:hover:not(:disabled) {
    color: #fff;
    background: rgba(255,255,255,.1);
  }

  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .empty {
    display: none;
    text-align: center;
    padding: 50px 0;
    color: #6b7391;
    font-size: 14px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: #5e678a;
  }

  footer a { color: #7cc4ff; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* 提示条 */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    padding: 11px 20px;
    font-size: 13.5px;
    border-radius: 10px;
    color: #eaf2ff;
    background: rgba(30, 40, 75, .96);
    border: 1px solid rgba(124, 196, 255, .35);
    box-shadow: 0 14px 34px -14px rgba(0,0,0,.9);
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 99;
  }

  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 520px) {
    .file-card { flex-direction: column; gap: 12px; }
    .card-icon { flex-basis: 44px; height: 44px; font-size: 20px; }
    .btn { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>📦 资源下载站</h1>
    <p>点击「下载」即可把文件保存到本地 · 支持搜索</p>
  </header>

  <div class="search-box">
    <input type="text" id="search" placeholder="搜索文件…（例如：烟感器）" autocomplete="off">
  </div>

  <main id="file-list"></main>
  <div class="empty" id="empty">😕 没有找到匹配的文件</div>

  <footer>
    数据来源：<a href="https://github.com/Jimmy3877530/ClassDownloader" target="_blank" rel="noopener">Jimmy3877530 / ClassDownloader</a>
  </footer>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   1. 配置区：以后加文件只要往 FILES 里加一项就行
   ========================================================= */
const REPO = 'Jimmy3877530/ClassDownloader';

/* 仓库分支（会自动依次尝试，不用管哪个是默认分支） */
const BRANCHES = ['main', 'master'];

const FILES = [
  {
    icon: '💻',
    title: '烟感器（Web 游戏）',
    file: '烟感器.html',          // ← 仓库里的真实文件名（含中文）
    desc: '一本地烟感器游戏，单文件 HTML，下载后双击即可在浏览器里运行。',
    size: '37 KB',
    date: '2026-06-14',
    type: 'HTML'
  }
  {
    icon: '📱',
    title: '手机刷机模拟器（Web 游戏）',
    file: '手机刷机.html',          // ← 仓库里的真实文件名（含中文）
    desc: '一本地刷机模拟器，连接手机后假装刷系统，各种系统都有内置模拟，单文件 HTML，下载后双击即可在浏览器里运行。',
    size: '53 KB',
    date: '2026-10-02',
    type: 'HTML'
  }
  /* 复制上面这一段，改一改就能添加新文件：
  ,{
    icon: '📄',
    title: '新文件',
    file: 'xxx.zip',
    desc: '说明文字',
    size: '1.2 MB',
    date: '2026-07-01',
    type: 'ZIP'
  }
  */
];

/* =========================================================
   2. 工具函数
   ========================================================= */

/** 生成该文件所有可用的直链（raw 主分支 → raw master → jsDelivr CDN） */
function buildUrls(fileName) {
  const p = encodeURIComponent(fileName);          // 中文文件名必须编码
  const raw = BRANCHES.map(
    b => `https://raw.githubusercontent.com/${REPO}/${b}/${p}`
  );
  const cdn = `https://cdn.jsdelivr.net/gh/${REPO}@main/${p}`;
  return [...raw, cdn];
}

/** 依次尝试每个直链，返回 Blob */
async function fetchBlob(urls, timeout = 20000) {
  let lastError;
  for (const url of urls) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      if (blob.size === 0) throw new Error('空文件');
      return { blob, url };
    } catch (err) {
      clearTimeout(timer);
      lastError = err;
      // 继续尝试下一个源
    }
  }
  throw lastError || new Error('所有下载源都不可用');
}

/** 触发浏览器保存文件 */
function saveBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;          // 关键：让浏览器「下载」而不是「打开」
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** 底部提示条 */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =========================================================
   3. 核心：下载
   ========================================================= */
async function downloadFile(item, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 正在获取…';

  try {
    const { blob } = await fetchBlob(buildUrls(item.file));
    saveBlob(blob, item.file);

    btn.textContent = '✅ 已开始下载';
    toast(`「${item.title}」已开始下载（${(blob.size / 1024).toFixed(1)} KB）`);
  } catch (err) {
    console.error(err);
    // 兜底方案：直接打开原始直链，让浏览器自行处理
    const fallback = buildUrls(item.file)[0];
    window.open(fallback, '_blank', 'noopener');
    btn.textContent = '↗ 已打开直链';
    toast('自动下载失败，已为你打开直链，请右键另存为');
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = original;
    }, 2600);
  }
}

/** 复制直链 */
async function copyLink(item) {
  const url = buildUrls(item.file)[0];
  try {
    await navigator.clipboard.writeText(url);
    toast('直链已复制到剪贴板');
  } catch {
    // 兼容非 HTTPS / 旧浏览器
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('直链已复制到剪贴板');
  }
}

/* =========================================================
   4. 渲染 & 搜索
   ========================================================= */
const listEl  = document.getElementById('file-list');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');

function render() {
  listEl.innerHTML = FILES.map((f, i) => `
    <article class="file-card" data-index="${i}">
      <div class="card-icon">${f.icon}</div>
      <div class="card-body">
        <h3>${f.title}</h3>
        <p class="desc">${f.desc}</p>
        <div class="meta">
          <span class="tag">${f.type}</span>
          <span>📦 ${f.size}</span>
          <span>🕒 ${f.date}</span>
        </div>
        <div class="actions">
          <button class="btn primary" data-act="download" data-index="${i}">⬇ 下载</button>
          <button class="btn ghost"   data-act="copy"     data-index="${i}">🔗 复制直链</button>
        </div>
      </div>
    </article>
  `).join('');
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const item = FILES[Number(btn.dataset.index)];
  if (!item) return;

  if (btn.dataset.act === 'download') downloadFile(item, btn);
  else copyLink(item);
});

searchEl.addEventListener('input', (e) => {
  const term = e.target.value.trim().toLowerCase();
  let visible = 0;

  listEl.querySelectorAll('.file-card').forEach(card => {
    const show = card.innerText.toLowerCase().includes(term);
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  emptyEl.style.display = visible === 0 ? 'block' : 'none';
});

render();
</script>
</body>
</html>
